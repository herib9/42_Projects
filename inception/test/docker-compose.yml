services:
# Servicio 1: La base de datos
  mariadb:
    image: mariadb:latest
    environment:
      MYSQL_ROOT_PASSWORD: 1234asdf
      MYSQL_DATABASE: my_base

  web:
    image: alpine:latest
    # Este comando hace ping al servicio 'mariadb' para comprobar que lo ve
    command: sh -c "apk add --no-cache mariadb-client && mysql -h mariadb -u root -pmi_super_password -e 'SHOW DATABASES;'"


